name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X github.com/liteploy/liteploy/internal/system.Version=$VERSION -X github.com/liteploy/liteploy/internal/system.CommitSHA=$COMMIT"
          
          # Build for Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o liteploy-linux-amd64 ./cmd/liteploy
          
          # Build for Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o liteploy-linux-arm64 ./cmd/liteploy

      - name: Generate Checksums
        run: |
          sha256sum liteploy-linux-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            liteploy-linux-amd64
            liteploy-linux-arm64
            checksums.txt
          generate_release_notes: true
